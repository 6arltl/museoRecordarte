<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Museo RecordArte - Exposición Virtual</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="highlight.js"></script>
  <!-- Mantén tu archivo JS referenciado -->
  <script src="info-panel.js"></script>

  <style>
    /* CRÍTICO: Asegura que el modal HTML flote por encima del Canvas 3D */
    #modal__window {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      display: none;
      /* Oculto por defecto, se activará desde el JS */
      /* display: flex; (esto lo manejará JavaScript) */
    }

    /* Agrega aquí el resto de tus estilos CSS para .modal__overlay, .modal__card, etc. */
  </style>
</head>

<body>

  <!-- TU VENTANA MODAL HTML -->
  <div id="modal__window" class="modal">
    <div class="modal__overlay"></div>
    <div class="modal__card">
      <button class="modal__close" aria-label="Cerrar modal">&times;</button>

      <!-- Contenedor izquierdo: Imagen + Lente selector -->
      <div class="modal__media" id="zoom__container">
        <div class="zoom__lens" id="zoom__lens"></div>
        <img src="Flyer.png" alt="Obra de Arte" id="zoom__base_img" />
      </div>

      <!-- Contenedor derecho: Texto y visor de aumento -->
      <div class="modal__right">
        <!-- Información habitual de la obra -->
        <div class="modal__content" id="modal__text_content">
          <h1>Título de la Obra</h1>
          <p>Descripción de la obra...</p>
        </div>

        <!-- Ventana de aumento -->
        <div class="modal__zoom_window" id="zoom__window">
          <img src="Flyer.png" alt="Detalle ampliado" id="zoom__target_img" />
        </div>
      </div>
    </div>
  </div>

  <!-- ESCENA A-FRAME (Añadimos html-modal-panel) -->
  <a-scene html-modal-panel background="color: #111" cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .raycastable">
    <a-assets>
      <a-asset-item id="museo-gltf" src="museo.gltf"></a-asset-item>
      <a-entity nav-mesh geometry="primitive: plane; width: 29; height: 29" rotation="-90 0 0" position="0 -0.1 0"
        visible="false"></a-entity>

      <!-- Obras de arte -->
      <img id="kazetachinuPoster" src="https://cdn.aframe.io/examples/ui/kazetachinuPoster.jpg"
        crossorigin="anonymous" />
      <img id="ponyoPoster" src="https://cdn.aframe.io/examples/ui/ponyoPoster.jpg" crossorigin="anonymous" />
      <img id="karigurashiPoster" src="https://cdn.aframe.io/examples/ui/karigurashiPoster.jpg"
        crossorigin="anonymous" />

      <!-- Mixins -->
      <a-mixin id="frame" geometry="primitive: plane; width: 0.5783552; height: 0.8192"
        material="color: white; shader: flat"
        animation__scale="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents: mouseenter"
        animation__scale_reverse="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"></a-mixin>
      <a-mixin id="poster" geometry="primitive: plane; width: 0.544768; height: 0.786432"
        material="color: white; shader: flat" position="0 0 0.005"></a-mixin>
    </a-assets>

    <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
    <a-light type="directional" color="#fffaed" intensity="0.8" position="-1 2 1"></a-light>

    <a-entity gltf-model="#museo-gltf" position="0 0 0" scale="1 1 1"></a-entity>

    <!-- CÁMARA MUCHO MÁS LIMPIA (Sin paneles 3D ni fondos bloqueadores) -->
    <a-entity id="rig" movement-controls="controls: keyboard,touch; speed: 0.2; constrainToNavMesh: true"
      position="0 0 0">
      <a-entity position="0 1.6 0" camera
        look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled:true;"></a-entity>
    </a-entity>

    <!-- Controles -->
    <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .raycastable"></a-entity>
    <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .raycastable"
      line="color: #118A7E"></a-entity>

    <!-- CUADROS 3D -->
    <a-entity id="ui" position="0 1.6 -2.5">
      <a-entity id="menu" highlight>
        <a-entity id="karigurashiButton" position="-0.8 0 -12.209" mixin="frame" class="raycastable menu-button">
          <a-entity material="src: #karigurashiPoster;" mixin="poster"></a-entity>
        </a-entity>

        <a-entity id="kazetachinuButton" position="0 0 -12.209" mixin="frame" class="raycastable menu-button">
          <a-entity material="src: #kazetachinuPoster" mixin="poster"></a-entity>
        </a-entity>

        <a-entity id="ponyoButton" position="0.8 0 -12.209" mixin="frame" class="raycastable menu-button">
          <a-entity material="src: #ponyoPoster" mixin="poster"></a-entity>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>
</body>

</html>

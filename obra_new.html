<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Museo RecordArte - Exposición Virtual</title>
  <meta name="description" content="Exposición de Arte Virtual • A-Frame">
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/info-message.js"></script>
  <script src="highlight.js"></script>
  <script src="info-panel.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/remix-dropdown.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
</head>

<body>
  <!-- Se eliminó el atributo "environment" para usar el modelo 3D personalizado -->
  <a-scene background="color: #111" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .raycastable"
    info-message="htmlSrc: #messageText">

    <a-assets>
      <a-asset-item id="messageText" src="message.html"></a-asset-item>

      <!-- AQUÍ CARGAMOS EL MODELO DEL MUSEO EN FORMATO GLTF O GLB -->
      <a-asset-item id="museo-gltf" src="museo.gltf"></a-asset-item>
      <a-entity nav-mesh geometry="primitive: plane; width: 29; height: 29" material="color: #00ff00; wireframe: true"
        rotation="-90 0 0" position="0 0.01 0" visible="true">
      </a-entity>

      <!-- Obras de arte (Imágenes) -->
      <img id="kazetachinu" src="https://cdn.aframe.io/examples/ui/kazetachinu.jpg" crossorigin="anonymous" />
      <img id="kazetachinuPoster" src="https://cdn.aframe.io/examples/ui/kazetachinuPoster.jpg"
        crossorigin="anonymous" />

      <img id="ponyo" src="https://cdn.aframe.io/examples/ui/ponyo.jpg" crossorigin="anonymous" />
      <img id="ponyoPoster" src="https://cdn.aframe.io/examples/ui/ponyoPoster.jpg" crossorigin="anonymous" />

      <img id="karigurashi" src="https://cdn.aframe.io/examples/ui/karigurashi.jpg" crossorigin="anonymous" />
      <img id="karigurashiPoster" src="https://cdn.aframe.io/examples/ui/karigurashiPoster.jpg"
        crossorigin="anonymous" />

      <!-- Mixins para los marcos y paneles -->
      <a-mixin id="frame" geometry="primitive: plane; width: 0.5783552; height: 0.8192"
        material="color: white; shader: flat"
        animation__scale="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents: mouseenter"
        animation__scale_reverse="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"></a-mixin>
      <a-mixin id="poster" geometry="primitive: plane; width: 0.544768; height: 0.786432"
        material="color: white; shader: flat" position="0 0 0.005"></a-mixin>
      <a-mixin id="movieImage" geometry="primitive: plane; width: 1.5; height: 0.81"
        material="src: #ponyo; shader: flat; transparent: true" position="0 0.495 0.002"></a-mixin>
    </a-assets>

    <!-- ILUMINACIÓN DE LA SALA DEL MUSEO -->
    <!-- Luz ambiental general suave -->
    <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
    <!-- Luz direccional para darle volumen al espacio y simular luces de galería -->
    <a-light type="directional" color="#fffaed" intensity="0.8" position="-1 2 1"></a-light>

    <!-- ENTORNO 3D DEL MUSEO (GLTF) -->
    <!-- Ajusta el scale y position según las dimensiones reales de tu modelo -->
    <a-entity gltf-model="#museo-gltf" position="0 0 0" scale="1 1 1">
    </a-entity>

    <a-entity id="background" position="0 0 0" geometry="primitive: sphere; radius: 2.0"
      material="color: red; side: back; shader: flat" scale="0.001 0.001 0.001" visible="false" class="raycastable">
    </a-entity>

    <!-- Cámara -->
    <a-entity id="rig" movement-controls="constrainToNavMesh: true" position="0 0 0">
      <a-entity position="0 1.6 0" camera
        look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled:true;">
        <a-entity id="fadeBackground" geometry="primitive: sphere; radius: 2.5"
          material="color: #999999; side: back; shader: flat; blending: subtractive;" visible="false">
        </a-entity>

        <a-entity id="infoPanel" position="0 0 -1.5" info-panel visible="false" scale="0.001 0.001 0.001"
          geometry="primitive: plane; width: 1.5; height: 1.8"
          material="color: #222222; shader: flat; transparent: false; depthTest: false; depthWrite: true"
          class="raycastable">
          <a-entity id="ponyoMovieImage" mixin="movieImage" material="src: #ponyo; depthTest: false"
            visible="false"></a-entity>
          <a-entity id="kazetachinuMovieImage" mixin="movieImage" material="src: #kazetachinu; depthTest: false"
            visible="false"></a-entity>
          <a-entity id="karigurashiMovieImage" mixin="movieImage" material="src: #karigurashi; depthTest: false"
            visible="false"></a-entity>
          <a-entity id="movieTitle" material="depthTest: true; depthWrite: true; fog: true; visible: true"
            depthTest="false" position="-0.68 -0.1 0"
            text="shader: msdf; anchor: left; width: 1.5; font: https://cdn.aframe.io/examples/ui/Viga-Regular.json; color: white; value: Título de la Obra"></a-entity>
          <a-entity id="movieDescription" position="-0.68 -0.2 0"
            text="baseline: top; shader: msdf; anchor: left; font: https://cdn.aframe.io/examples/ui/Viga-Regular.json; color: white; value: Descripción de la obra expuesta en el museo..."></a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Controles para VR -->
    <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .raycastable"></a-entity>
    <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .raycastable"
      line="color: #118A7E"></a-entity>

    <!-- UI DE LA EXPOSICIÓN DE ARTE -->
    <!-- Si el museo es muy grande o muy chico, puedes ajustar la posición Z (-2.5) para acercar o alejar los cuadros -->
    <a-entity id="ui" position="0 1.6 -2.5">

      <!-- Menú de Cuadros/Pósters -->
      <a-entity id="menu" highlight>
        <a-entity id="karigurashiButton" position="-0.8 0 -12.209" mixin="frame" class="raycastable menu-button">
          <a-entity material="src: #karigurashiPoster;" mixin="poster"></a-entity>
        </a-entity>

        <a-entity id="kazetachinuButton" position="0 0 -12.209" mixin="frame" class="raycastable menu-button">
          <a-entity material="src: #kazetachinuPoster" mixin="poster"></a-entity>
        </a-entity>

        <a-entity id="ponyoButton" position="0.8 0 -12.209" mixin="frame" class="raycastable menu-button">
          <a-entity material="src: #ponyoPoster" mixin="poster"></a-entity>
        </a-entity>
      </a-entity>

    </a-entity>
  </a-scene>
</body>

</html>
